name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/skills-mcp/package-lock.json
            packages/warpmetal-cli/package-lock.json

      - name: Install registry tooling
        run: npm ci

      - name: Install MCP server
        run: npm ci --prefix packages/skills-mcp

      - name: Install integration engine
        run: npm ci --prefix packages/warpmetal-cli

      - name: Build registry and channels
        run: npm run build

      - name: Build internal registry
        run: npm run build:internal

      - name: Verify schema, checksums, catalogs, and secrets
        run: npm run verify

      - name: Verify internal registry and isolation
        run: npm run verify:internal

      - name: Validate skill conventions and integration policies
        run: npm run validate:skills

      - name: Test MCP server
        run: npm test

      - name: Test integration engine
        run: npm --prefix packages/warpmetal-cli test

      # The offline half of the provider guard. Everything these checks compare
      # is derived from files that are committed - the route table, the two
      # generated documents, the allowlist, the provider catalog, the tool
      # catalog and the request fixtures - so a hand-edit or a forgotten
      # generator fails here with a `re-run:` line and nothing to interpret.
      # The two pin fetches (`check:plane-inventory`, `check:plane-sdk`) read the
      # vendor's release instead, so they stay out of this gate and run in
      # `plane-drift.yml` on a schedule: a vendor outage must not be able to
      # block a merge.
      - name: Verify the pinned provider surface
        run: |
          npm --prefix packages/warpmetal-cli run check:plane-offline
          npm --prefix packages/skills-mcp run check:providers-offline

      - name: Integration library self-test
        run: bash tools/check-all.sh

      - name: Drift check
        run: git diff --exit-code

      - name: Docker smoke test
        run: |
          docker build -t skills-mcp:ci packages/skills-mcp
          docker run --rm skills-mcp:ci --version
          docker run -d --name skills-mcp -p 8080:8080 skills-mcp:ci --http --port 8080
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          docker rm -f skills-mcp
