name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/skills-mcp/package-lock.json

      - run: npm ci
      - run: npm ci --prefix packages/skills-mcp

      - name: Build release registry and snapshot
        env:
          REGISTRY_VERSION: ${{ github.ref_name }}
        run: npm run build

      - name: Set package version from tag
        working-directory: packages/skills-mcp
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish with provenance
        working-directory: packages/skills-mcp
        run: npm publish --provenance --access public

  # The integration engine ships on the same tag as the skills, so a skill that
  # declares `minimumWarpmetalCli` can never point at a release that does not
  # exist. It is a separate package (`@warpmetal/cli`) because it installs a
  # superset `warpmetal` binary; the skills registry does not depend on it.
  publish-cli:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/warpmetal-cli/package-lock.json

      - run: npm ci --prefix packages/warpmetal-cli

      - name: Build, test, and typecheck
        run: npm --prefix packages/warpmetal-cli test

      - name: Set package version from tag
        working-directory: packages/warpmetal-cli
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish with provenance
        working-directory: packages/warpmetal-cli
        run: npm publish --provenance --access public

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/skills-mcp/package-lock.json

      - run: npm ci
      - run: npm ci --prefix packages/skills-mcp

      - name: Build release registry and snapshot
        env:
          REGISTRY_VERSION: ${{ github.ref_name }}
        run: npm run build

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/warpmetal/skills-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/skills-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  deploy-catalog:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/skills-mcp/package-lock.json

      - run: npm ci

      - name: Build versioned catalog
        env:
          REGISTRY_VERSION: ${{ github.ref_name }}
        run: |
          npm run build
          npm run pages

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

  github-release:
    needs: [publish-npm, publish-cli, publish-image, deploy-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The engine's tarball is attached so an air-gapped install can match the
      # registry it came from without reaching npm.
      - name: Pack the integration engine
        run: |
          npm ci --prefix packages/warpmetal-cli
          npm --prefix packages/warpmetal-cli pack --pack-destination .
          ls -1 warpmetal-cli-*.tgz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            registry.json \
            registry.schema.json \
            warpmetal-cli-*.tgz
